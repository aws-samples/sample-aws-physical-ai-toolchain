# Default configuration for OSMO on AWS deployment scripts
# Dynamic values are loaded from config/deployment-config.yaml via read_config()

#------------------------------------------------------------------------------
# Central Configuration File
#------------------------------------------------------------------------------

_DEFAULTS_BASE_DIR="${SETUP_DIR:-$SCRIPT_DIR}"
DEPLOYMENT_CONFIG="${DEPLOYMENT_CONFIG:-$_DEFAULTS_BASE_DIR/config/deployment-config.yaml}"

# Source common.sh early so read_config() is available (scripts that source
# defaults.conf also source common.sh, but we tolerate re-sourcing).
if [[ -z "${_COMMON_SH_LOADED:-}" ]] && [[ -f "$_DEFAULTS_BASE_DIR/lib/common.sh" ]]; then
  source "$_DEFAULTS_BASE_DIR/lib/common.sh"
fi

#------------------------------------------------------------------------------
# Versions (read from central config with env-var overrides)
#------------------------------------------------------------------------------
# Fallbacks so chart fetch and version display never use empty values.
OSMO_VERSION="${OSMO_VERSION:-$(read_config 'osmo.version')}"
OSMO_CHART_VERSION="${OSMO_CHART_VERSION:-$(read_config 'osmo.chart_version')}"
OSMO_CHART_BASE_URL="${OSMO_CHART_BASE_URL:-$(read_config 'osmo.chart_base_url')}"
GPU_OPERATOR_VERSION="${GPU_OPERATOR_VERSION:-$(read_config 'dependencies.gpu_operator_version')}"
KAI_SCHEDULER_VERSION="${KAI_SCHEDULER_VERSION:-$(read_config 'dependencies.kai_scheduler_version')}"
AWS_LB_CONTROLLER_VERSION="${AWS_LB_CONTROLLER_VERSION:-$(read_config 'dependencies.aws_lb_controller_version')}"
CLUSTER_AUTOSCALER_VERSION="${CLUSTER_AUTOSCALER_VERSION:-$(read_config 'dependencies.cluster_autoscaler_version')}"
EXTERNAL_SECRETS_VERSION="${EXTERNAL_SECRETS_VERSION:-$(read_config 'dependencies.external_secrets_version')}"
EXTERNAL_DNS_VERSION="${EXTERNAL_DNS_VERSION:-$(read_config 'dependencies.external_dns_version')}"
OSMO_VERSION="${OSMO_VERSION:-6.3.1}"
OSMO_CHART_VERSION="${OSMO_CHART_VERSION:-1.3.1}"
OSMO_CHART_BASE_URL="${OSMO_CHART_BASE_URL:-https://helm.ngc.nvidia.com/nvidia/osmo/charts}"
GPU_OPERATOR_VERSION="${GPU_OPERATOR_VERSION:-v24.9.0}"
KAI_SCHEDULER_VERSION="${KAI_SCHEDULER_VERSION:-v0.12.4}"
AWS_LB_CONTROLLER_VERSION="${AWS_LB_CONTROLLER_VERSION:-1.7.1}"
CLUSTER_AUTOSCALER_VERSION="${CLUSTER_AUTOSCALER_VERSION:-9.35.0}"
EXTERNAL_SECRETS_VERSION="${EXTERNAL_SECRETS_VERSION:-0.9.13}"
EXTERNAL_DNS_VERSION="${EXTERNAL_DNS_VERSION:-1.14.3}"

#------------------------------------------------------------------------------
# Helm Repositories
#------------------------------------------------------------------------------
# Fallbacks used when read_config returns empty (e.g. yq variant or config path).
OSMO_HELM_REPO_NAME="${OSMO_HELM_REPO_NAME:-osmo}"
OSMO_HELM_REPO="${OSMO_HELM_REPO:-$(read_config 'helm_repos.osmo')}"
NVIDIA_HELM_REPO="${NVIDIA_HELM_REPO:-$(read_config 'helm_repos.nvidia')}"
AWS_HELM_REPO="${AWS_HELM_REPO:-$(read_config 'helm_repos.aws_eks')}"
EXTERNAL_SECRETS_REPO="${EXTERNAL_SECRETS_REPO:-$(read_config 'helm_repos.external_secrets')}"
AUTOSCALER_HELM_REPO="${AUTOSCALER_HELM_REPO:-$(read_config 'helm_repos.autoscaler')}"
EXTERNAL_DNS_REPO="${EXTERNAL_DNS_REPO:-$(read_config 'helm_repos.external_dns')}"
# Ensure critical helm repo URLs are never empty (avoid "repo url required" from helm_repo_add)
AWS_HELM_REPO="${AWS_HELM_REPO:-https://aws.github.io/eks-charts}"
EXTERNAL_SECRETS_REPO="${EXTERNAL_SECRETS_REPO:-https://charts.external-secrets.io}"
AUTOSCALER_HELM_REPO="${AUTOSCALER_HELM_REPO:-https://kubernetes.github.io/autoscaler}"
EXTERNAL_DNS_REPO="${EXTERNAL_DNS_REPO:-https://kubernetes-sigs.github.io/external-dns}"
OSMO_HELM_REPO="${OSMO_HELM_REPO:-https://helm.ngc.nvidia.com/nvidia/osmo}"
NVIDIA_HELM_REPO="${NVIDIA_HELM_REPO:-https://helm.ngc.nvidia.com/nvidia}"

#------------------------------------------------------------------------------
# Namespaces
#------------------------------------------------------------------------------
# Fallbacks so namespace is never empty (helm_upgrade_install requires it).
OSMO_NAMESPACE="${OSMO_NAMESPACE:-$(read_config 'namespaces.osmo')}"
OSMO_OPERATOR_NAMESPACE="${OSMO_OPERATOR_NAMESPACE:-$(read_config 'namespaces.osmo_operator')}"
OSMO_WORKFLOWS_NAMESPACE="${OSMO_WORKFLOWS_NAMESPACE:-$(read_config 'namespaces.osmo_workflows')}"
GPU_OPERATOR_NAMESPACE="${GPU_OPERATOR_NAMESPACE:-$(read_config 'namespaces.gpu_operator')}"
KAI_SCHEDULER_NAMESPACE="${KAI_SCHEDULER_NAMESPACE:-$(read_config 'namespaces.kai_scheduler')}"
EXTERNAL_SECRETS_NAMESPACE="${EXTERNAL_SECRETS_NAMESPACE:-$(read_config 'namespaces.external_secrets')}"
OSMO_NAMESPACE="${OSMO_NAMESPACE:-osmo}"
OSMO_OPERATOR_NAMESPACE="${OSMO_OPERATOR_NAMESPACE:-osmo-operator}"
OSMO_WORKFLOWS_NAMESPACE="${OSMO_WORKFLOWS_NAMESPACE:-osmo-workflows}"
GPU_OPERATOR_NAMESPACE="${GPU_OPERATOR_NAMESPACE:-gpu-operator}"
KAI_SCHEDULER_NAMESPACE="${KAI_SCHEDULER_NAMESPACE:-kai-scheduler}"
EXTERNAL_SECRETS_NAMESPACE="${EXTERNAL_SECRETS_NAMESPACE:-external-secrets}"

#------------------------------------------------------------------------------
# Terraform Directory
#------------------------------------------------------------------------------

DEFAULT_TF_DIR="${DEFAULT_TF_DIR:-../001-iac}"

#------------------------------------------------------------------------------
# OSMO Image Location
#------------------------------------------------------------------------------

OSMO_IMAGE_LOCATION="${OSMO_IMAGE_LOCATION:-$(read_config 'osmo.image_location')}"
# Fallback so the OSMO image registry is never empty (workflow task pods need
# valid init-container/client image refs; an empty value yields "/init-container:tag").
OSMO_IMAGE_LOCATION="${OSMO_IMAGE_LOCATION:-nvcr.io/nvidia/osmo}"

#------------------------------------------------------------------------------
# Timeouts
#------------------------------------------------------------------------------
# Fallbacks so --timeout is never empty (helm/kubectl reject "").
HELM_TIMEOUT="${HELM_TIMEOUT:-$(read_config 'timeouts.helm')}"
KUBECTL_TIMEOUT="${KUBECTL_TIMEOUT:-$(read_config 'timeouts.kubectl')}"
HELM_TIMEOUT="${HELM_TIMEOUT:-600s}"
KUBECTL_TIMEOUT="${KUBECTL_TIMEOUT:-300s}"

#------------------------------------------------------------------------------
# Defaults for Services
#------------------------------------------------------------------------------

SERVICE_MIN_REPLICAS="${SERVICE_MIN_REPLICAS:-2}"
SERVICE_MAX_REPLICAS="${SERVICE_MAX_REPLICAS:-5}"
WORKER_MIN_REPLICAS="${WORKER_MIN_REPLICAS:-2}"
WORKER_MAX_REPLICAS="${WORKER_MAX_REPLICAS:-10}"
BACKEND_LISTENER_REPLICAS="${BACKEND_LISTENER_REPLICAS:-1}"
BACKEND_WORKER_REPLICAS="${BACKEND_WORKER_REPLICAS:-1}"

#------------------------------------------------------------------------------
# Feature Flags
#------------------------------------------------------------------------------

ENABLE_CLOUDWATCH_LOGS="${ENABLE_CLOUDWATCH_LOGS:-$(read_config 'features.enable_cloudwatch_logs')}"
ENABLE_PROMETHEUS_METRICS="${ENABLE_PROMETHEUS_METRICS:-$(read_config 'features.enable_prometheus_metrics')}"
ENABLE_EXTERNAL_SECRETS="${ENABLE_EXTERNAL_SECRETS:-$(read_config 'features.enable_external_secrets')}"
