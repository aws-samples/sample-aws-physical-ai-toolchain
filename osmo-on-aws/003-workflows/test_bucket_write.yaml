#
# Test workflow: writes a file to the datasets S3 bucket the OSMO-native way —
# URL-based `outputs:` (NOT the deprecated `dataset:` name abstraction, and not
# manual AWS CLI calls). See:
# https://nvidia.github.io/OSMO/release/6.3/user_guide/tutorials/data/index.html
#
# How it works:
#   - The task writes results into {{output}} (i.e. /osmo/output).
#   - After the task completes, OSMO (osmo-ctrl) uploads {{output}} to the
#     s3:// URL listed under `outputs:`.
#   - S3 auth needs no keys: the pod runs under the `osmo-workflow` IRSA
#     ServiceAccount (attached via the gpu_tolerations pod template on the l40s
#     platform), which grants read/write on the datasets bucket. osmo-ctrl
#     resolves the bucket via boto3's default chain -> the pod's web-identity
#     token. (The datasets bucket is registered path-only in services.configs,
#     so no static credential overrides IRSA.)
#
# Runs on l40s because that is where the osmo-workflow IRSA SA is wired. To run
# S3 I/O on CPU-only nodes, add `serviceAccountName: osmo-workflow` to the
# default pod template (services.configs.podTemplates.default_ctrl/default_user)
# and switch to a non-GPU platform.
#
# Submit: osmo workflow submit 003-workflows/test_bucket_write.yaml
# Verify: aws s3 ls s3://osmo-prod-osm03-datasets/manual-test/

workflow:
  name: test-dataset-bucket-write
  resources:
    default:
      platform: l40s
      gpu: 1
      cpu: 1
      memory: 2Gi
      storage: 1Gi
  tasks:
  - name: write-to-dataset-bucket
    image: ubuntu:24.04
    command: ["bash", "-c"]
    args:
    - |
      set -euo pipefail
      ts="$(date -u +%Y%m%dT%H%M%SZ)"
      echo "OSMO URL-output test on AWS ${ts}" > {{output}}/test-${ts}.txt
      echo "wrote-via=OSMO outputs url (osmo-ctrl + osmo-workflow IRSA)" >> {{output}}/test-${ts}.txt
      echo "Wrote {{output}}/test-${ts}.txt; OSMO will upload {{output}} to the outputs URL."
      ls -l {{output}}
    outputs:
    - url: s3://osmo-prod-osm03-datasets/manual-test/
