# Hello World Workflow
# A minimal workflow to verify OSMO is working correctly on AWS EKS.
#
# Submit with:
#   osmo workflow submit 003-workflows/hello_world.yaml

workflow:
  name: hello-world
  tasks:
  - name: hello
    image: ubuntu:22.04
    command: [bash, -c]
    args:
      - |
        echo "Hello from OSMO on AWS!"
        echo ""
        echo "Hostname: $(hostname)"
        echo "Date:     $(date)"
        echo "Region:   ${AWS_REGION:-us-west-2}"
        echo ""
        echo "This workflow ran successfully on Amazon EKS."
