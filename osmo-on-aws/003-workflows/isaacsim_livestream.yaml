# Isaac Sim Livestream Workflow
# Launches NVIDIA Isaac Sim in headless mode with livestreaming enabled.
#
# Submit with:
#   osmo workflow submit 003-workflows/isaacsim_livestream.yaml
#
# Once the task is running, open two terminals and port-forward (TCP + UDP):
#   osmo workflow port-forward <workflow-id> stream --port 47995-48012,49000-49007,49100 --connect-timeout 300
#   osmo workflow port-forward <workflow-id> stream --port 47995-48012,49000-49007 --udp --connect-timeout 300
#
# Then open the Isaac Sim Streaming Client and connect to localhost.

workflow:
  name: isaacsim-livestream
  resources:
    sim-resource:
      cpu: 1
      gpu: 1
      memory: 8Gi
      storage: 10Gi
  tasks:
  - name: stream
    image: nvcr.io/nvidia/isaac-sim:5.1.0
    command: ["bash"]
    args: ["/tmp/entry.sh"]
    resource: sim-resource
    environment:
      ACCEPT_EULA: "Y"
    files:
    - path: /tmp/entry.sh
      contents: |
        cd /isaac-sim
        ./runheadless.sh --/app/livestream/enabled=true
  timeout:
    exec_timeout: 2h
