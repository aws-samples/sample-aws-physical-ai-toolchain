# Model-family adapter manifest (registry).
name: molmoact2
# The 'smoke-v2' tag is an ECR IMAGE TAG, not terminology. ECR tags here are
# immutable, so renaming this string would point at an image that does not exist.
# It gets the sample naming when the image is next rebuilt under a new tag.
train_image: vla/molmoact2:smoke-v2
defaults_json: entrypoints/train/molmoact2/defaults.json
train_instance: ml.g6e.12xlarge
eval_instance: ml.g6e.12xlarge
# Submit-time operational requirements. This file is the SOLE owner of them: the
# resource keys that used to sit in defaults.json were read by NOBODY --
# load_family_schemas() and registry.family_schemas() both project only
# input_config_schema and provenance_keys -- so openvla's per-role block there was a
# declared value governing nothing. These must be known BEFORE any container exists.
# instance_note: g6e.12xlarge is the demonstrated instance; the g6e.2xlarge floor is inherited from the upstream EC2 recipe, not locally validated (often capacity-constrained).
train_volume_gb: 250
eval_volume_gb: 250
