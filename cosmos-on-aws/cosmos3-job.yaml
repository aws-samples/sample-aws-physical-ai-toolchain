# Cosmos3-Super V2V generation as a self-contained Kubernetes Job.
#
# Unlike the earlier version of this manifest (server-only, generation driven
# by an external kubectl port-forward + curl), this Job runs the FULL
# pipeline inside the container and exits when done:
#   1. Start the vLLM-Omni Cosmos3-Super server in the background
#   2. Wait for /v1/models to report ready
#   3. Download the reference video from S3 (via the pod's IRSA credentials)
#   4. POST /v1/videos/sync to generate the V2V output
#   5. Upload the result (+ the original reference) to S3
#   6. Exit — the Job reports Completed, Cluster Autoscaler scales the GPU
#      node back down once it's idle past scale-down-unneeded-time
#
# Configure via the env vars below (INPUT_S3_URI, OUTPUT_S3_PREFIX, PROMPT,
# SEED) instead of editing the script.
apiVersion: batch/v1
kind: Job
metadata:
  name: cosmos3-vllm-omni
  namespace: default
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  # Give the Job enough time for model load (~15-20 min first time) +
  # generation (~2-8 min) + upload.
  activeDeadlineSeconds: 2700
  template:
    metadata:
      labels:
        app: cosmos3-vllm-omni
    spec:
      serviceAccountName: cosmos3-generator
      restartPolicy: Never
      nodeSelector:
        node.kubernetes.io/purpose: gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: vllm-omni
          image: vllm/vllm-omni:cosmos3
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /workspace/hf-cache /workspace/io

              # --- Ensure the AWS CLI is available (image doesn't ship it) ---
              # Installed via pip instead of the official zip installer — the
              # image has python3/pip3 but not `unzip`, which the zip
              # installer requires. pip's awscli is pure-Python, no unzip
              # needed, and is fast enough here (a few seconds).
              if ! command -v aws >/dev/null 2>&1; then
                echo "=== Installing AWS CLI (via pip) ==="
                pip3 install --quiet awscli
              fi

              # --- Start the server in the background ---
              echo "=== Starting vLLM-Omni Cosmos3-Super: cfg=2 uly=4 hsdp=8 ==="
              vllm serve nvidia/Cosmos3-Super --omni \
                --cfg-parallel-size 2 \
                --ulysses-degree 4 \
                --use-hsdp --hsdp-shard-size 8 \
                --init-timeout 2400 --stage-init-timeout 1800 \
                --host 0.0.0.0 --port 8000 &
              SERVER_PID=$!

              # --- Wait for readiness ---
              echo "=== Waiting for server readiness (can take ~15-20 min on first weight download) ==="
              for i in $(seq 1 90); do
                if curl -sf -m 5 http://localhost:8000/v1/models | grep -q "Cosmos3-Super"; then
                  echo "Server ready after ${i} checks."
                  break
                fi
                if ! kill -0 "$SERVER_PID" 2>/dev/null; then
                  echo "ERROR: server process died during startup." >&2
                  exit 1
                fi
                sleep 20
              done

              if ! curl -sf -m 5 http://localhost:8000/v1/models | grep -q "Cosmos3-Super"; then
                echo "ERROR: server did not become ready in time." >&2
                exit 1
              fi

              # --- Download the reference video from S3 ---
              REF_LOCAL=/workspace/io/reference.mp4
              echo "=== Downloading reference video: ${INPUT_S3_URI} ==="
              aws s3 cp "${INPUT_S3_URI}" "$REF_LOCAL" --region "${AWS_REGION}"

              # --- Generate ---
              OUT_LOCAL=/workspace/io/output.mp4
              echo "=== Generating V2V (prompt below) ==="
              echo "${PROMPT}"
              HTTP_CODE=$(curl -sS -X POST http://localhost:8000/v1/videos/sync \
                -H "Accept: video/mp4" \
                -F "model=nvidia/Cosmos3-Super" \
                -F "prompt=${PROMPT}" \
                -F "size=1280x720" \
                -F "num_frames=189" \
                -F "fps=24" \
                -F "num_inference_steps=35" \
                -F "guidance_scale=6.0" \
                -F "max_sequence_length=4096" \
                -F "flow_shift=10.0" \
                -F "extra_params={\"condition_frame_indexes_vision\":[0,1],\"condition_video_keep\":\"first\"}" \
                -F "seed=${SEED}" \
                -F "input_reference=@${REF_LOCAL};type=video/mp4" \
                -o "$OUT_LOCAL" \
                --max-time 600 \
                -w "%{http_code}")
              echo "Generation HTTP status: $HTTP_CODE"
              if [ "$HTTP_CODE" != "200" ]; then
                echo "ERROR: generation failed (HTTP $HTTP_CODE)." >&2
                exit 1
              fi
              ls -lh "$OUT_LOCAL"

              # --- Upload result (+ original reference) to S3 ---
              echo "=== Uploading to ${OUTPUT_S3_PREFIX} ==="
              aws s3 cp "$OUT_LOCAL" "${OUTPUT_S3_PREFIX}/${OUTPUT_FILENAME}" --region "${AWS_REGION}"
              aws s3 cp "$REF_LOCAL" "${OUTPUT_S3_PREFIX}/${REFERENCE_FILENAME}" --region "${AWS_REGION}"

              echo "=== Done. Shutting down server. ==="
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
              echo "Job complete."
          env:
            - { name: HF_HOME, value: "/workspace/hf-cache" }
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: token }
            - { name: AWS_REGION, value: "us-east-2" }
            - { name: INPUT_S3_URI, value: "s3://physical-ai-dev-datasets-804152302157/groot-data/ur3/dataset/videos/chunk-000/observation.images.wrist/episode_000000.mp4" }
            - { name: OUTPUT_S3_PREFIX, value: "s3://physical-ai-dev-datasets-804152302157/cosmos-samples" }
            - { name: OUTPUT_FILENAME, value: "augmented_episode_000000_eks_selfcontained.mp4" }
            - { name: REFERENCE_FILENAME, value: "original_episode_000000_eks_selfcontained.mp4" }
            - { name: SEED, value: "100" }
            - name: PROMPT
              value: >-
                A UR3 robot arm with a Robotiq gripper reaches down to a dark matte
                table, grasps a small red wooden block, lifts it slowly, and places
                it onto a yellow sticky note approximately 6 inches away. Top-down
                wrist camera view. Colorful wooden blocks are scattered on the table.
                Smooth deliberate motion.
          resources:
            requests:
              nvidia.com/gpu: "8"
            limits:
              nvidia.com/gpu: "8"
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 400Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
